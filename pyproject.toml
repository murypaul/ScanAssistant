[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanassistant"
description = "Assistant de numérisation patrimoniale de négatifs photographiques"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "ScanAssistant contributors" }]

dependencies = [
    "PySide6>=6.11,<7",
    "rawpy>=0.27,<0.28",
    "opencv-python-headless>=5.0,<6",
    "Pillow>=12.3,<13",
    "numpy>=2.5,<3",
    "tifffile>=2026.6.1,<2027",
    "imagecodecs>=2026.6,<2027",
    "watchdog>=6.0,<7",
    "PyExifTool>=0.5,<0.6",
    "platformdirs>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-qt>=4.5,<5",
    "ruff>=0.15,<0.16",
    "mypy>=2.2,<3",
]
# Tethered camera support (remote trigger + live view, DECISIONS.md I-138):
# requires the system `libgphoto2` library besides this Python binding.
camera = [
    "gphoto2>=2.5,<3",
]

[tool.setuptools.dynamic]
version = { attr = "scanassistant.__version__" }

[tool.setuptools.packages.find]
include = ["scanassistant*"]

[tool.setuptools.package-data]
"scanassistant.resources" = ["**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["scanassistant"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "exiftool.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["scanassistant/core", "scanassistant/project", "scanassistant/watcher", "scanassistant/imaging", "scanassistant/metadata", "scanassistant/journal"]

[tool.coverage.report]
fail_under = 80
